name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate Tauri Cargo.lock
        run: |
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          git diff --exit-code -- src-tauri/Cargo.lock
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:tauri
      - name: Native core checks
        run: |
          cargo fmt --manifest-path crates/battle-p2p-core/Cargo.toml --check
          cargo clippy --manifest-path crates/battle-p2p-core/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/battle-p2p-core/Cargo.toml --locked
      - run: node scripts/test-p2p-native-roundtrip.mjs

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path crates/battle-p2p-core/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run tauri build -- --bundles deb
      - run: test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
