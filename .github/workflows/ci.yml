name: CI

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  p2p-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --manifest-path crates/battle-p2p-core/Cargo.toml --locked --all-targets

  tauri-lockfile:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Tauri lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated Tauri lockfile once
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(p2p): refresh Tauri Cargo lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify committed Tauri lockfile
        run: git diff --exit-code -- src-tauri/Cargo.lock

  tauri-rust-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test Tauri Rust state and persistence
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Check Tauri Rust warnings
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  p2p-native-core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check native formatting
        run: cargo fmt --manifest-path crates/battle-p2p-core/Cargo.toml --check
      - name: Check native warnings
        run: cargo clippy --manifest-path crates/battle-p2p-core/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test native content and cache
        run: cargo test --manifest-path crates/battle-p2p-core/Cargo.toml --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify native cache to Viewer and Creator roundtrip
        run: node scripts/test-p2p-native-roundtrip.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build

      - name: Build static frontend for Tauri
        run: npm run build:tauri

  tauri-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Tauri Rust state and persistence
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri Debian package
        run: npm run tauri build -- --bundles deb

      - name: Verify Debian package
        run: test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
