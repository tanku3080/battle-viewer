name: Auto PR Body With Commit List

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate commit list
        id: commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMMITS=$(git log --oneline "$BASE_SHA..$HEAD_SHA")
          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR body
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.commits.outputs.commits }}
        with:
          script: |
            const marker = "<!-- auto-commit-list -->";
            const commits = (process.env.COMMITS || "").trim();
            const list = commits
              ? commits.split("\n").map(c => `- ${c}`).join("\n")
              : "- No commits found";
            const current = context.payload.pull_request.body || "";
            const baseBody = current.includes(marker)
              ? current.split(marker)[0].trimEnd()
              : current.trimEnd();
            const body = `${baseBody}\n\n${marker}\n## Commits\n${list}\n`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });
